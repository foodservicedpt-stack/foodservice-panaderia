<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panadería · Planificación</title>
<meta name="description" content="Planifica las cantidades de producción y visualiza el calendario." />
<link rel="stylesheet" href="css/style.css" />
<meta name="theme-color" content="#a54a26" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Panadería" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <main id="main">
    <div id="page-status" class="page-status" role="status" aria-live="polite"></div>
    <section class="page-section">
      <h2>Planificación</h2>

      <!-- NIVEL 1: VISTA SEMANAL / MENSUAL -->
      <div id="plan-overview">
        <div class="plan-head">
          <div class="plan-nav">
            <button class="icon-btn" id="prev-week" aria-label="Semana anterior">‹</button>
            <strong id="week-label"></strong>
            <button class="icon-btn" id="next-week" aria-label="Semana siguiente">›</button>
          </div>
          <button class="today-btn secondary" id="today-btn">Hoy</button>
        </div>
        <div class="plan-day-strip" id="plan-day-strip" aria-label="Días de la semana"></div>
        <div class="cal-month" id="cal-month" aria-label="Calendario mensual"></div>
        <div class="cal-week" id="cal-week" aria-label="Vista semanal"></div>
      </div>

      <!-- NIVEL 2: DETALLE DEL DÍA -->
      <div id="plan-detail" class="plan-detail" hidden>
        <div class="plan-detail-head">
          <button id="detail-back" class="ghost">‹ Volver</button>
          <div class="plan-detail-days">
            <button id="detail-prev" class="icon-btn" aria-label="Día anterior">‹</button>
            <strong id="detail-date"></strong>
            <button id="detail-next" class="icon-btn" aria-label="Día siguiente">›</button>
          </div>
        </div>
        <div class="cal-detail-section"><h5>Panes de consumo</h5><div id="detail-panes"></div></div>
        <div class="cal-detail-section"><h5>Otras producciones del día</h5><div id="detail-productions"></div></div>
        <a href="amasadoras.html" class="add-elaboration">＋ Añadir elaboración</a>
      </div>
    </section>
  </main>

  <script type="module" src="js/planificacion.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
