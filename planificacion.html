<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panadería · Planificación</title>
<meta name="description" content="Planifica las cantidades de producción y visualiza el calendario." />
<link rel="stylesheet" href="css/style.css" />
<meta name="theme-color" content="#a54a26" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Panadería" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <main id="main">
    <div id="page-status" class="page-status" role="status" aria-live="polite"></div>
    <section class="page-section">
      <h2>Planificación</h2>
      <div class="plan-head">
        <div class="plan-nav">
          <button class="icon-btn" id="prev-month" aria-label="Mes anterior">‹</button>
          <strong id="month-label"></strong>
          <button class="icon-btn" id="next-month" aria-label="Mes siguiente">›</button>
        </div>
        <button class="today-btn secondary" id="today-btn">Hoy</button>
      </div>
      <div class="cal-month" id="cal-month" aria-label="Calendario mensual"></div>
      <div class="cal-week" id="cal-week" aria-label="Vista semanal"></div>
      <div class="cal-day-detail" id="cal-day-detail"></div>
    </section>
  </main>

  <script type="module" src="js/planificacion.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
