<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panadería · Inicio</title>
<meta name="description" content="Gestión de inventario, planificación y amasadoras del obrador." />
<link rel="stylesheet" href="css/style.css" />
<meta name="theme-color" content="#a54a26" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <main id="main">
  <div id="page-status" class="page-status" role="status" aria-live="polite"></div>
    <div class="card">
      <p class="eyebrow dashboard-date" id="fecha"></p>
      <h2 id="saludo">Hola, equipo</h2>
    </div>

    <div class="card conditional-card" id="alerts-card" hidden>
      <h3>Productos con stock bajo</h3>
      <table>
        <thead><tr><th>Producto</th><th>Stock</th><th>Cobertura (días)</th></tr></thead>
        <tbody id="alerts-body"></tbody>
      </table>
    </div>

    <div class="card conditional-card" id="amasadoras-card" hidden>
      <h3>Amasadoras en fermentación</h3>
      <div id="amasadoras-list"></div>
    </div>

    <h2 class="eyebrow quick-access-heading">Accesos rápidos</h2>
    <div class="grid grid-3">
      <a href="inventario.html" class="tile">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
        </span>
        <div>
          <div class="tile-title">Inventario</div>
          <div class="tile-sub">Consulta y ajusta el stock</div>
        </div>
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </a>
      <a href="planificacion.html" class="tile">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>
        </span>
        <div>
          <div class="tile-title">Planificación</div>
          <div class="tile-sub">Semanas y cantidades</div>
        </div>
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </a>
      <a href="orden-trabajo.html" class="tile">
        <span class="tile-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3 8-8"/><path d="M21 12v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h9"/></svg>
        </span>
        <div>
          <div class="tile-title">Orden de trabajo</div>
          <div class="tile-sub">Tareas del día</div>
        </div>
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </a>
    </div>
  </main>

  <script>
    window.addEventListener("error", (event) => {
      const status = document.getElementById("page-status");
      if (!status || status.classList.contains("error-state")) return;
      status.className = "error-state";
      status.textContent = "No se ha podido iniciar la aplicación. Recarga la página.";
      console.error(event.error || event.message);
    });
    window.addEventListener("unhandledrejection", (event) => {
      const status = document.getElementById("page-status");
      if (!status || status.classList.contains("error-state")) return;
      status.className = "error-state";
      status.textContent = "No se ha podido cargar el inicio. Recarga la página.";
      console.error(event.reason);
    });
  </script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
