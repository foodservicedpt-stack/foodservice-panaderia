<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panadería · Orden de trabajo</title>
<meta name="description" content="Lista de tareas del día y notas de producción." />
<link rel="stylesheet" href="css/style.css" />
<meta name="theme-color" content="#a54a26" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Panadería" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <main id="main">
    <div id="page-status" class="page-status" role="status" aria-live="polite"></div>
    <div class="card">
      <div class="row-between">
        <h2>Orden de trabajo</h2>
        <div class="row">
          <button id="prev-day" class="secondary">◀</button>
          <strong id="day-label"></strong>
          <button id="next-day" class="secondary">▶</button>
        </div>
      </div>
      <div id="items-list"></div>
    </div>

    <div class="card">
      <h3>Nota del día</h3>
      <textarea id="nota-input" rows="3" placeholder="Añade una nota para hoy..."></textarea>
      <button id="guardar-nota-btn">Guardar nota</button>
    </div>
  </main>

  <script type="module" src="js/orden-trabajo.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
