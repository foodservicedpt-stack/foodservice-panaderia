name: Enviar aviso diario del obrador

# Dispara la Cloud Function dailyPushHttp (alternativa al plan Blaze).
# Necesitas dos secretos de repositorio:
#   FIREBASE_FUNCTION_URL -> URL de despliegue de dailyPushHttp
#   CRON_SECRET           -> el mismo valor que "CRON_SECRET" en Firebase Functions (env)
# Nota: el cron de GitHub Actions va en UTC. 05:30 UTC ≈ 06:30 España en invierno (07:30 en verano).

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la Cloud Function
        env:
          URL: ${{ secrets.FIREBASE_FUNCTION_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ]; then echo "Falta FIREBASE_FUNCTION_URL"; exit 0; fi
          curl -fsS -X POST "$URL" -H "x-cron-secret: $SECRET" || echo "El aviso diario no se pudo enviar"
