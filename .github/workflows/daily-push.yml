name: Aviso diario del obrador (push)

on:
  schedule:
    # 04:30 y 05:30 UTC. El script solo envía a partir de las 06:30 Madrid y es idempotente,
    # así que cubre tanto invierno (UTC+1) como verano (UTC+2).
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --prefix .github/scripts
      - name: Escribir credenciales de servicio (secreto)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"
      - name: Enviar aviso diario
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node .github/scripts/daily-push.mjs
