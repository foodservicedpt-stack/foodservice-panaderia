<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panadería · Amasadoras</title>
<meta name="description" content="Controla las amasadoras en fermentación y su historial." />
<link rel="stylesheet" href="css/style.css" />
<meta name="theme-color" content="#a54a26" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <main id="main">
    <div id="page-status" class="page-status" role="status" aria-live="polite"></div>
    <div class="card">
      <div class="row-between">
        <h2>Amasadoras</h2>
        <button id="nueva-btn">Nueva amasadora</button>
      </div>
      <div id="nueva-form" class="card nested-card" hidden>
        <label class="field-label">Producto</label>
        <select id="producto-select" aria-label="Selecciona el producto"></select>
        <label class="field-label" for="fecha-input">Fecha de inicio</label>
        <input type="date" id="fecha-input" />
        <div class="row">
          <button id="crear-btn">Crear</button>
          <button id="cancelar-btn" class="secondary">Cancelar</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>En fermentación</h3>
      <div id="pendientes-list"></div>
    </div>

    <div class="card">
      <h3>Historial</h3>
      <table>
        <thead><tr><th>Producto</th><th>Fecha inicio</th><th>Estado</th><th>Piezas</th></tr></thead>
        <tbody id="historial-body"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/amasadoras.js"></script>
</body>
</html>
