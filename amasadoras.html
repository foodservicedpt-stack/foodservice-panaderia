<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panadería · Amasadoras</title>
<meta name="description" content="Controla las amasadoras en fermentación y su historial." />
<link rel="stylesheet" href="css/style.css" />
<meta name="theme-color" content="#a54a26" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Panadería" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <main id="main">
    <div id="page-status" class="page-status" role="status" aria-live="polite"></div>
    <div class="card">
      <div class="row-between">
        <h2>Amasadoras</h2>
        <button id="nueva-btn">Nueva amasadora</button>
      </div>
      <div id="nueva-form" class="card nested-card" hidden>
        <label class="field-label" for="tipo-select">Tipo de producción</label>
        <select id="tipo-select" aria-label="Tipo de producción"></select>
        <div id="producto-field">
          <label class="field-label" for="producto-select">Producto</label>
          <select id="producto-select" aria-label="Selecciona el producto"></select>
        </div>
        <div id="nombre-field" hidden>
          <label class="field-label" for="nombre-input">Nombre</label>
          <input type="text" id="nombre-input" placeholder="Ej. Yogur natural" maxlength="80" />
        </div>
        <label class="field-label" for="fecha-input">Fecha de producción</label>
        <input type="date" id="fecha-input" />
        <label class="field-label" for="hora-input">Hora de inicio</label>
        <input type="time" id="hora-input" value="08:00" />
        <div class="row">
          <button id="crear-btn">Crear</button>
          <button id="cancelar-btn" class="secondary">Cancelar</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>En producción</h3>
      <div id="pendientes-list"></div>
      <details id="future-weeks" class="future-weeks" hidden>
        <summary>Próximas semanas</summary>
        <div id="future-weeks-body"></div>
      </details>
    </div>

    <div class="card">
      <h3>Historial</h3>
      <div class="historial-tabs" id="historial-tabs" role="tablist"></div>
      <div id="historial-body"></div>
    </div>
  </main>

  <script type="module" src="js/amasadoras.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
