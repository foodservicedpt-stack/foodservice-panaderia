<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panadería · Inventario</title>
<meta name="description" content="Consulta el stock, ajusta cantidades y revisa los últimos movimientos." />
<link rel="stylesheet" href="css/style.css" />
<meta name="theme-color" content="#a54a26" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Panadería" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <main id="main">
    <div id="page-status" class="page-status" role="status" aria-live="polite"></div>
    <div class="card">
      <div class="row-between section-heading">
        <div>
          <h2>Inventario</h2>
          <p class="meta-text">Ajusta el stock indicando siempre el motivo.</p>
        </div>
        <label class="field-inline" for="ajuste-notas">Motivo del ajuste
          <input type="text" id="ajuste-notas" maxlength="200" placeholder="Ej. Merma, recepción..." />
        </label>
      </div>
      <div class="table-scroll"><table>
        <thead><tr><th>Producto</th><th>Stock actual</th><th>Cobertura</th><th>Ajustar</th></tr></thead>
        <tbody id="productos-body"></tbody>
      </table></div>
    </div>

    <div class="card">
      <h3>Últimos movimientos</h3>
      <div class="table-scroll"><table>
        <thead><tr><th>Fecha</th><th>Producto</th><th>Cantidad</th><th>Tipo</th><th>Notas</th></tr></thead>
        <tbody id="movimientos-body"></tbody>
      </table></div>
    </div>
  </main>

  <script type="module" src="js/inventario.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
