<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panadería · Configuración</title>
<meta name="description" content="Gestiona los productos del obrador." />
<link rel="stylesheet" href="css/style.css" />
<meta name="theme-color" content="#a54a26" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Panadería" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <main id="main">
    <div id="page-status" class="page-status" role="status" aria-live="polite"></div>
    <div class="card">
      <h2>Catálogo y parámetros de producción</h2>
      <p class="meta-text">Gestiona los productos y define los valores usados para calcular la cobertura de stock.</p>
      <div id="productos-list"></div>
      <button id="nuevo-producto-btn" class="secondary new-product-button">Nuevo producto</button>
      <div id="nuevo-producto" class="card nested-card" hidden>
        <label class="field-label" for="nuevo-nombre">Nombre del producto</label>
        <input type="text" id="nuevo-nombre" placeholder="Ej. Pan de chapata" />
        <div class="row">
          <button id="crear-producto-btn">Crear</button>
          <button id="cancelar-producto-btn" class="secondary">Cancelar</button>
        </div>
      </div>
    </div>

  </main>

  <script type="module" src="js/configuracion.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
